<!--
  Qunity — "Reset password" email template.

  Paste into Supabase: Authentication -> Emails -> Templates -> Reset Password
  (Message body), with the subject:  איפוס הסיסמה שלך ב-Qunity

  The button links to /auth/confirm with a token hash, which works whichever
  browser or device the email is opened on. {{ .SiteURL }} is the Site URL
  set under Authentication -> URL Configuration — it must be the app's live
  address, since it's also where the logo image is loaded from.
-->
<div dir="rtl" style="margin:0;padding:24px 12px;background:#eceaf0;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:20px;overflow:hidden;">
    <tr>
      <td align="center" style="background:#140e0c;padding:26px 0 22px;">
        <img src="{{ .SiteURL }}/logo/qunity-logo-transparent.png" width="150" alt="Qunity" style="display:block;width:150px;height:auto;border:0;">
      </td>
    </tr>
    <tr>
      <td align="center" style="padding:28px 26px 8px;color:#221a33;">
        <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;">בוחרים סיסמה חדשה</h1>
        <p style="margin:0 0 22px;font-size:16px;line-height:1.6;color:#4f4960;">
          קיבלנו בקשה לאיפוס הסיסמה של החשבון שלך ב-Qunity. לחיצה על הכפתור תוביל לבחירת סיסמה חדשה.
        </p>
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password"
           style="display:inline-block;padding:15px 34px;border-radius:16px;background:#a32894;color:#ffffff;font-size:18px;font-weight:bold;text-decoration:none;">
          בחירת סיסמה חדשה
        </a>
        <p style="margin:22px 0 0;font-size:13px;line-height:1.6;color:#7d778e;">
          הקישור בתוקף לשעה. אם לא ביקשת איפוס, אפשר להתעלם מהמייל הזה והסיסמה לא תשתנה.
        </p>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding:18px;border-top:1px solid #ece6f2;font-size:12px;color:#a79fb6;">
        Qunity · Thrive Together
      </td>
    </tr>
  </table>
</div>
